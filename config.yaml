# See docs/adr for the research decisions each key encodes.
# No magic numbers should live in code; every threshold belongs here.

# Chosen from docs/journal.md (2026-08-05): the window where Economics and
# Sports both show real, simultaneous settlement volume (top-20-by-volume
# series per category, sub-daily recurring series excluded). Politics stays
# thin across every window tried -- see the journal entry's caveat before
# treating it as a fully-covered category.
date_range:
  start: "2025-12-01"
  end: "2026-06-06"  # Kalshi's live/historical cutoff at query time (GET /historical/cutoff)

categories:
  - Politics
  - Economics
  - Sports
  - Crypto

# Confirmed against docs.kalshi.com/getting_started/api_environments.
kalshi_base_url: "https://external-api.kalshi.com/trade-api/v2"

# Kalshi's unauthenticated "Basic" tier read bucket refills at 200
# tokens/sec; default request cost is 10 tokens => ~20 req/sec ceiling.
# Set below that ceiling for headroom. See docs.kalshi.com/getting_started/rate_limits.
rate_limit_per_second: 15

# Polymarket's public read API. Ingesting Polymarket is the optional/stretch
# second venue; the URL lives here so src/ingest/polymarket.py never hardcodes it.
polymarket_base_url: "https://gamma-api.polymarket.com"

# Retry policy for every venue client (src/ingest/base.py).
# Applies to 429s, 5xx responses, and transport-level errors.
#
# max_attempts counts the FIRST try, so 5 = one attempt plus four retries.
# Backoff is exponential (initial * 2^n) capped at max_backoff_seconds, with up
# to jitter_seconds of uniform random noise added. Jitter matters because a
# rate-limited run retries many in-flight requests at once; without noise they
# all wake on the same schedule and re-collide (the thundering-herd problem).
# A server-supplied Retry-After header always wins over this computed backoff.
retry:
  max_attempts: 5
  initial_backoff_seconds: 1.0
  max_backoff_seconds: 60.0
  jitter_seconds: 1.0
  timeout_seconds: 30.0

# Ingestion scope and layout (src/ingest/kalshi.py).
ingest:
  raw_dir: "data/raw"

  # /historical/markets is queried per series, so a category is ingested by
  # walking its highest-volume series. 20 mirrors the exploration that chose
  # date_range above (docs/journal.md, 2026-08-05), so reports/figures/
  # date_range_exploration.png describes the same slice we actually ingest.
  # A handful of series carry most of a category's volume; the long tail is
  # near-zero-volume markets where price reflects noise, not a market view.
  top_n_series_per_category: 20

  # Markets per page. 200 is Kalshi's max, so this minimises round trips.
  page_limit: 200

  # Sub-daily recurring series (a Bitcoin price settling every 15 minutes)
  # settle so often they dwarf every other series' counts, and a 15-minute
  # price bet is not the same object as an election or a CPI print.
  # `frequency` is a server-side enum: custom, one_off, annual, monthly,
  # weekly, daily, hourly, fifteen_min. Match on it -- never on the ticker
  # string, which false-positives on Sports "1H" (First Half) markets.
  subdaily_frequencies:
    - hourly
    - fifteen_min

  # Second ingestion pass: the price the market was actually forecasting at.
  #
  # The settled snapshot's last_price is unusable -- 92.5% of binary markets
  # have it pinned to the settlement value, because the market had already
  # stopped being uncertain (median market lifetime is only ~24h, and the last
  # trade *before close* is 90% pinned too). Full measurements and the horizon
  # sweep are in docs/adr/003-implied-price-definition.md.
  trades:
    trades_dir: "data/raw_trades"

    # Hours before close_time to read the last trade at. The FIRST entry is the
    # study's primary horizon; the rest are sensitivity runs.
    #
    # 1h maximises usable yield -- retention x (1 - pinned):
    #     T-0h   99.6% retained, 90.0% pinned ->  10.0%
    #     T-1h   89.2% retained, 17.5% pinned ->  73.6%   <- primary
    #     T-6h   74.8% retained,  4.8% pinned ->  71.2%
    #     T-24h  30.8% retained,  7.8% pinned ->  28.4%
    #     T-72h   6.8% retained, 29.4% pinned ->   4.8%
    # Sample too late and the price is just the answer; sample too early and
    # the market did not exist yet, leaving a sample selected on longevity.
    # Each horizon is independently resumable, so adding one re-fetches nothing.
    horizons_hours:
      - 1
      - 6
      - 24

    # /historical/trades returns newest-first, so one row is enough: it *is*
    # the last trade at or before the cutoff.
    request_limit: 1

# raw -> interim -> processed (src/clean.py).
clean:
  # How the market's implied probability is read off the data.
  #
  #   horizon_trade  the last trade at or before close - price_horizon_hours.
  #                  The only defensible choice here; see ADR 003.
  #   last_trade     the settled snapshot's last_price. 92.5% pinned to the
  #                  settlement value -- kept so the writeup can SHOW the
  #                  degenerate curve it produces, not because it is usable.
  #   bid_ask_mid    unavailable: 54.9% of settled books are 0/1 wide.
  #   close_price    previous_price_dollars; identical to last_trade on 96.5%
  #                  of records, so it inherits the same defect.
  price_method: "horizon_trade"

  # Must be one of ingest.trades.horizons_hours -- validated at load time.
  price_horizon_hours: 1

  interim_path: "data/interim/contracts.parquet"
  processed_path: "data/processed/contracts.parquet"

# Calibration measurement (src/analysis/). See docs/adr/005-bucketing-and-tests.md.
analysis:
  # Decile buckets on implied_price. Ten is the literature's convention and
  # keeps every bucket populated here (the thinnest holds ~6,400 contracts),
  # so bucket width is never the binding constraint on precision -- the
  # clustering is.
  n_buckets: 10

  confidence: 0.95

  # Every interval and p-value is clustered on `event_ticker`. A 250-golfer
  # field is ONE outcome expressed as 250 contracts, and threshold ladders are
  # monotonically bound by construction, so contracts are nowhere near
  # independent (mean 3.35 per event). ADR 004 decision 6: "any interval
  # computed without this clustering is wrong and must not be reported."
  cluster_on: "event_ticker"

  # Reps for the block bootstrap that resamples whole events. 2,000 is enough
  # for a 95% interval (the 2.5% tail is ~50 reps) without the run taking
  # long enough to discourage re-running it.
  bootstrap_reps: 2000

  # Fixed so an identical processed table yields identical intervals forever.
  bootstrap_seed: 20260901

  # Benjamini-Hochberg false-discovery rate across the per-bucket tests.
  # Correction handles testing MANY hypotheses; clustering handles correlated
  # observations WITHIN one. They fix different errors and both are needed.
  fdr_alpha: 0.05

  # Segmentation (src/analysis/segmentation.py) splits the corpus by category
  # and by market lifetime, which multiplies the number of tests and divides
  # the events available to each.
  #
  # Coarser buckets for thinner slices: quintiles rather than deciles. Chosen
  # from the SEGMENT SIZES (Sports 29,471 events, Economics 186, Politics 16),
  # never from segment results -- edges picked after seeing which split looks
  # significant are not edges, they are a finding manufactured by hand.
  segment_n_buckets: 5

  # (Family-wide correction is the CORRECT family, not automatically a
  # stricter one -- BH is step-up, so strong signal in one segment can lower
  # another's q. See src/analysis/segmentation.py.)
  #
  # A segment bucket below this many EVENTS is reported but never tested: it
  # keeps its point estimate and interval, is flagged `underpowered`, and is
  # left out of the Benjamini-Hochberg family entirely. Testing a cell with
  # four events spends alpha on a question the data cannot answer, and makes
  # every other test in the family pay for it.
  min_events_per_bucket: 30
